name: Schannel TLS development checks

on:
  push:
    branches: [feature/schannel-tls]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Windows cross-compilers
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build both complete clients
        run: make -j4 all
      - name: Test portable endpoint parser
        run: |
          cc -Wall -Wextra -Werror -fsanitize=address,undefined -I. tests/test_tls_endpoint.c tls_endpoint.c -o /tmp/test-tls-endpoint
          /tmp/test-tls-endpoint
      - name: Build isolated transport probes
        run: |
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -O2 -I. tests/tls_probe.c tls.c tls_endpoint.c -lws2_32 -lsecur32 -lcrypt32 -lncrypt -o tests/tls_probe64.exe
          i686-w64-mingw32-gcc -Wall -Wextra -Werror -O2 -I. tests/tls_probe.c tls.c tls_endpoint.c -lws2_32 -lsecur32 -lcrypt32 -lncrypt -o tests/tls_probe32.exe
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-tls-development-probes
          path: tests/tls_probe*.exe
          if-no-files-found: error

  windows-integration:
    needs: build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-tls-development-probes
          path: probes
      - name: Install test-only certificate tooling
        run: python -m pip install cryptography
      - name: Exercise Schannel using disposable local certificates
        shell: pwsh
        run: |
          $env:MRBIG_TLS_PROBE = (Resolve-Path "probes/tls_probe${{ matrix.bits }}.exe").Path
          python -m unittest discover -s tests -p test_tls_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
