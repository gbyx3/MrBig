name: Schannel TLS development checks

on:
  push:
    branches: [feature/schannel-tls]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Windows cross-compilers
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build both complete clients
        run: make -j4 all
      - name: Verify PE hardening and native runtime imports
        run: python3 tests/check_pe_hardening.py X86/mrbig.exe X64/mrbig64.exe
      - name: Test portable endpoint parser
        run: |
          cc -Wall -Wextra -Werror -fsanitize=address,undefined -I. tests/test_tls_endpoint.c tls_endpoint.c -o /tmp/test-tls-endpoint
          /tmp/test-tls-endpoint
      - name: Build isolated transport probes
        run: |
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -O2 -fstack-protector-strong -static -static-libgcc -Wl,--dynamicbase,--nxcompat,--high-entropy-va,--no-insert-timestamp -I. tests/tls_probe.c tls.c tls_endpoint.c -lws2_32 -lsecur32 -lcrypt32 -lncrypt -o tests/tls_probe64.exe
          i686-w64-mingw32-gcc -Wall -Wextra -Werror -O2 -fstack-protector-strong -static -static-libgcc -Wl,--dynamicbase,--nxcompat,--no-insert-timestamp -I. tests/tls_probe.c tls.c tls_endpoint.c -lws2_32 -lsecur32 -lcrypt32 -lncrypt -o tests/tls_probe32.exe
          python3 tests/check_pe_hardening.py tests/tls_probe32.exe tests/tls_probe64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-tls-development-probes
          path: tests/tls_probe*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-tls-development-clients
          path: |
            X86/mrbig.exe
            X64/mrbig64.exe
          if-no-files-found: error

  windows-integration:
    needs: build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-tls-development-probes
          path: probes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-tls-development-clients
          path: clients
      - name: Install test-only certificate tooling
        run: python -m pip install -r tests/requirements-windows.txt
      - name: Extract pinned stunnel test receiver (no installation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe --fail --location --silent --show-error https://www.stunnel.org/downloads/stunnel-5.82-win64-installer.exe --output stunnel-installer.exe
          if ($LASTEXITCODE -ne 0) { throw 'stunnel download failed' }
          if ((Get-FileHash stunnel-installer.exe -Algorithm SHA256).Hash -ne '722c1ad626919af2b0034666b4d19cc4795e925c32f60e8f3c59af4fb3ad2dfc') { throw 'stunnel digest mismatch' }
          7z.exe x stunnel-installer.exe -ostunnel-fixture -y
          if ($LASTEXITCODE -ne 0) { throw 'stunnel extraction failed' }
      - name: Exercise Schannel using disposable local certificates
        shell: pwsh
        run: |
          $env:MRBIG_TLS_PROBE = (Resolve-Path "probes/tls_probe${{ matrix.bits }}.exe").Path
          $env:MRBIG_STUNNEL = (Resolve-Path 'stunnel-fixture/bin/tstunnel.exe').Path
          if ('${{ matrix.bits }}' -eq '32') {
            $env:MRBIG_CLIENT = (Resolve-Path 'clients/X86/mrbig.exe').Path
          } else {
            $env:MRBIG_CLIENT = (Resolve-Path 'clients/X64/mrbig64.exe').Path
          }
          python -m unittest discover -s tests -p test_tls_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
